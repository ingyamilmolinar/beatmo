name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_CACHE: /cache/golangci-lint

# Every job but `images`, `browser-matrix` and `verdict` runs inside the pinned
# image (ci/versions.env), and every step is a make target that runs the same
# way natively and under `make dev`.
jobs:
  # Builds and pushes the CI images only when ci/ changed (the tag is a content
  # hash); otherwise it finds both tags and finishes in seconds.
  images:
    name: CI images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      build: ${{ steps.publish.outputs.build }}
      browser: ${{ steps.publish.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
      - id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_IMAGE_PUSH: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '0' }}
        run: make image-publish

  build:
    name: Build
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ${{ needs.images.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /cache/go-build
            /cache/gomod
            /cache/npm
            /cache/golangci-lint
          key: go-${{ github.job }}-${{ hashFiles('ci/**') }}-${{ hashFiles('src/go/go.sum', 'src/go/**/*.go', 'src/c/**', 'src/js/package-lock.json') }}
          restore-keys: go-${{ github.job }}-${{ hashFiles('ci/**') }}-
      - run: make ci-build

  lint:
    name: Lint
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ${{ needs.images.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /cache/go-build
            /cache/gomod
            /cache/npm
            /cache/golangci-lint
          key: go-${{ github.job }}-${{ hashFiles('ci/**') }}-${{ hashFiles('src/go/go.sum', 'src/go/**/*.go', 'src/c/**', 'src/js/package-lock.json') }}
          restore-keys: go-${{ github.job }}-${{ hashFiles('ci/**') }}-
      - run: make lint

  test-go:
    name: Test Go (-tags test)
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: ${{ needs.images.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /cache/go-build
            /cache/gomod
            /cache/npm
            /cache/golangci-lint
          key: go-${{ github.job }}-${{ hashFiles('ci/**') }}-${{ hashFiles('src/go/go.sum', 'src/go/**/*.go', 'src/c/**', 'src/js/package-lock.json') }}
          restore-keys: go-${{ github.job }}-${{ hashFiles('ci/**') }}-
      - run: make test-go-tagged COVER=1
      - if: always()
        run: make coverage-summary
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage/go.out
          retention-days: 30

  test-audio-real:
    name: Test audio (real DSP)
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ${{ needs.images.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /cache/go-build
            /cache/gomod
            /cache/npm
            /cache/golangci-lint
          key: go-${{ github.job }}-${{ hashFiles('ci/**') }}-${{ hashFiles('src/go/go.sum', 'src/go/**/*.go', 'src/c/**', 'src/js/package-lock.json') }}
          restore-keys: go-${{ github.job }}-${{ hashFiles('ci/**') }}-
      - run: make test-audio-real

  test-real-go:
    name: Test Go (real Ebiten + xvfb)
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: ${{ needs.images.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /cache/go-build
            /cache/gomod
            /cache/npm
            /cache/golangci-lint
          key: go-${{ github.job }}-${{ hashFiles('ci/**') }}-${{ hashFiles('src/go/go.sum', 'src/go/**/*.go', 'src/c/**', 'src/js/package-lock.json') }}
          restore-keys: go-${{ github.job }}-${{ hashFiles('ci/**') }}-
      - run: make test-real-go

  test-race:
    name: Test Go (race)
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ${{ needs.images.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /cache/go-build
            /cache/gomod
            /cache/npm
            /cache/golangci-lint
          key: go-${{ github.job }}-${{ hashFiles('ci/**') }}-${{ hashFiles('src/go/go.sum', 'src/go/**/*.go', 'src/c/**', 'src/js/package-lock.json') }}
          restore-keys: go-${{ github.job }}-${{ hashFiles('ci/**') }}-
      - run: make test-race

  # gcov line coverage of our own C DSP sources (miniaudio excluded) via the
  # native CGo test run, floor at the recorded baseline.
  coverage-c:
    name: C coverage
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ${{ needs.images.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /cache/go-build
            /cache/gomod
            /cache/npm
            /cache/golangci-lint
          key: go-${{ github.job }}-${{ hashFiles('ci/**') }}-${{ hashFiles('src/go/go.sum', 'src/go/**/*.go', 'src/c/**', 'src/js/package-lock.json') }}
          restore-keys: go-${{ github.job }}-${{ hashFiles('ci/**') }}-
      - run: make coverage-c-check COVERAGE_C_XVFB=1
      - if: always()
        run: make coverage-summary
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c-coverage
          path: |
            coverage/c-summary.txt
            coverage/c/
            coverage/go-native.out
          retention-days: 30

  # Reference audio is never committed and no test reads it; the corpus is
  # fetched outside the checkout only to re-derive the calibrations.
  refs:
    name: Reference corpus
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ${{ needs.images.outputs.build }}
    env:
      BEATMO_WAV_REFS: ${{ github.workspace }}/../wav-refs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /cache/go-build
            /cache/gomod
            /cache/npm
            /cache/golangci-lint
          key: go-${{ github.job }}-${{ hashFiles('ci/**') }}-${{ hashFiles('src/go/go.sum', 'src/go/**/*.go', 'src/c/**', 'src/js/package-lock.json') }}
          restore-keys: go-${{ github.job }}-${{ hashFiles('ci/**') }}-
      - run: make refs-ci

  browser-matrix:
    name: Browser test matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: make browser-matrix BATCH_SIZE=${{ vars.BROWSER_BATCH_SIZE || '4' }}

  browser:
    name: "Browser tests (batch ${{ matrix.index }})"
    needs: [images, browser-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ${{ needs.images.outputs.browser }}
      options: --ipc=host --init
    strategy:
      matrix: ${{ fromJson(needs.browser-matrix.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /cache/go-build
            /cache/gomod
            /cache/npm
            /cache/golangci-lint
          key: go-${{ github.job }}-${{ hashFiles('ci/**') }}-${{ hashFiles('src/go/go.sum', 'src/go/**/*.go', 'src/c/**', 'src/js/package-lock.json') }}
          restore-keys: go-${{ github.job }}-${{ hashFiles('ci/**') }}-
      - run: make test-browser-batch TESTS="${{ matrix.tests }}"

  # The one required check: shard and batch counts can change without touching
  # branch protection.
  verdict:
    name: CI verdict
    if: always()
    needs: [images, build, lint, test-go, test-audio-real, test-real-go, test-race, coverage-c, refs, browser-matrix, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: make ci-verdict
