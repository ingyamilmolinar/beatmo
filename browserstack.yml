# Credentials can also come from BROWSERSTACK_USERNAME / BROWSERSTACK_ACCESS_KEY.
userName: yamilmolinarrive_oM5OQs
accessKey: NLQHgjdr94pT6KADh4qm

# projectName must avoid |, ;, >, <, ", ?, %, /, \, newlines and tabs.
projectName: BrowserStack Samples 
# Set `buildName` as the name of the job / testsuite being run
buildName: browserstack build 
# buildIdentifier is appended to buildName: ${BUILD_NUMBER} (a counter, the default) or ${DATE_TIME}.
buildIdentifier: '#${BUILD_NUMBER}' # Supports strings along with either/both ${expression}

platforms:
  - os: OS X
    osVersion: Big Sur
    browserName: Chrome
    browserVersion: latest
  - os: Windows
    osVersion: 10
    browserName: Edge
    browserVersion: latest
  - deviceName: Samsung Galaxy S22 Ultra
    browserName: chrome # Try 'samsung' for Samsung browser
    osVersion: 12.0
    
# Threads per platform: 3 platforms at 2 run 6 parallel sessions.
parallelsPerPlatform: 1

# BrowserStack Local tunnels to the localhost server the tests start.
browserstackLocal: true # <boolean> (Default false)

debug: false # <boolean> # Set to true if you need screenshots for every selenium command ran
networkLogs: false # <boolean> Set to true to enable HAR logs capturing
consoleLogs: errors # <string> Remote browser's console debug levels to be printed (Default: errors)
# consoleLogs: disable | errors | warnings | info | verbose.

# testReporting sends SDK data to automation.browserstack.com; false disables it.
testReporting: true
